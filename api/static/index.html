<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Churn Risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F5;
    --surface: #FFFFFF;
    --ink: #1C2533;
    --muted: #5B6678;
    --line: #D5DBE4;
    --accent: #2848A8;
    --on-accent: #FFFFFF;
    --stay: #0F7B6C;
    --churn: #B4234A;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121826;
      --surface: #1B2333;
      --ink: #E7ECF3;
      --muted: #9AA6B8;
      --line: #2E3A4F;
      --accent: #8EA8FF;
      --on-accent: #121826;
      --stay: #4CC3AE;
      --churn: #F07A98;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 64px; }

  header h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }

  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  form, .result { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }

  fieldset { border: 0; padding: 0; margin: 0 0 24px; }
  legend { font-weight: 600; font-size: 1.05rem; margin-bottom: 12px; padding: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; font-weight: 500; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
  input, select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button {
    font: inherit; font-weight: 600; width: 100%; padding: 12px 20px;
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }

  .result { position: sticky; top: 20px; min-height: 260px; }
  .result h2 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 16px; }
  .empty { color: var(--muted); margin: 0; }
  .error { color: var(--churn); margin: 0; }
  .pct { font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .verdict { font-size: 1.2rem; font-weight: 600; margin: 10px 0 18px; }
  .meter { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0; transition: width 0.5s ease; }
  .scale { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .meta { font-size: 0.82rem; color: var(--muted); margin: 18px 0 0; }
  @media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Customer churn risk</h1>
    <p>Enter a subscriber's details to estimate how likely they are to cancel.</p>
  </header>

  <div class="layout">
    <form id="churn-form" novalidate>
      <fieldset>
        <legend>Viewing activity</legend>
        <div class="grid">
          <label>Total watch hours
            <input name="watch_hours" type="number" min="0" step="0.1" value="12" required>
          </label>
          <label>Average watch time per day
            <span class="hint">In hours</span>
            <input name="avg_watch_time_per_day" type="number" min="0" step="0.01" value="0.8" required>
          </label>
          <label>Days since last login
            <input name="last_login_days" type="number" min="0" step="1" value="10" required>
          </label>
          <label>Favorite genre
            <select name="favorite_genre" required>
              <option>Action</option>
              <option>Comedy</option>
              <option>Documentary</option>
              <option selected>Drama</option>
              <option>Horror</option>
              <option>Romance</option>
              <option>Sci-Fi</option>
            </select>
          </label>
          <label>Main device
            <select name="device" required>
              <option>Desktop</option>
              <option>Laptop</option>
              <option>Mobile</option>
              <option>Tablet</option>
              <option selected>TV</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Account</legend>
        <div class="grid">
          <label>Plan
            <select name="subscription_type" id="plan" required>
              <option>Basic</option>
              <option selected>Standard</option>
              <option>Premium</option>
            </select>
          </label>
          <label>Monthly fee
            <span class="hint">Fills in from the plan; you can change it</span>
            <input name="monthly_fee" id="fee" type="number" min="0" step="0.01" value="13.99" required>
          </label>
          <label>Number of profiles
            <input name="number_of_profiles" type="number" min="1" step="1" value="2" required>
          </label>
          <label>Payment method
            <select name="payment_method" required>
              <option selected>Credit Card</option>
              <option>Crypto</option>
              <option>Debit Card</option>
              <option>Gift Card</option>
              <option>PayPal</option>
            </select>
          </label>
          <label>Region
            <select name="region" required>
              <option>Africa</option>
              <option>Asia</option>
              <option selected>Europe</option>
              <option>North America</option>
              <option>Oceania</option>
              <option>South America</option>
            </select>
          </label>
        </div>
      </fieldset>

      <button type="submit" id="submit">Predict churn</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>Prediction</h2>
      <div id="output">
        <p class="empty">Fill in the details and select Predict churn to see this subscriber's risk.</p>
      </div>
    </section>
  </div>
</main>

<script>
  const PLAN_FEES = { Basic: 8.99, Standard: 13.99, Premium: 17.99 };
  const NUMBER_FIELDS = ["watch_hours", "last_login_days", "monthly_fee", "number_of_profiles", "avg_watch_time_per_day"];

  const form = document.getElementById("churn-form");
  const output = document.getElementById("output");
  const button = document.getElementById("submit");

  document.getElementById("plan").addEventListener("change", (e) => {
    const fee = PLAN_FEES[e.target.value];
    if (fee !== undefined) document.getElementById("fee").value = fee;
  });

  function showMessage(text, className) {
    output.innerHTML = "";
    const p = document.createElement("p");
    p.className = className;
    p.textContent = text;
    output.appendChild(p);
  }

  function showResult(data) {
    const pct = Math.round(data.churn_probability * 1000) / 10;
    const churned = data.prediction === 1;
    const color = churned ? "var(--churn)" : "var(--stay)";

    output.innerHTML = `
      <div class="pct" style="color:${color}">${pct}%</div>
      <div class="verdict">${churned ? "Likely to cancel" : "Likely to stay"}</div>
      <div class="meter" role="img" aria-label="Churn probability ${pct} percent"><span></span></div>
      <div class="scale"><span>0%</span><span>50%</span><span>100%</span></div>
      <p class="meta">Chance this subscriber cancels, from model version ${data.model_version}.</p>
    `;
    const bar = output.querySelector(".meter span");
    bar.style.background = color;
    requestAnimationFrame(() => { bar.style.width = pct + "%"; });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = Object.fromEntries(new FormData(form).entries());
    for (const field of NUMBER_FIELDS) {
      const value = parseFloat(payload[field]);
      if (Number.isNaN(value) || value < 0) {
        showMessage("Enter a number of 0 or more in every numeric field.", "error");
        return;
      }
      payload[field] = value;
    }

    button.disabled = true;
    button.textContent = "Predicting…";
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        const detail = Array.isArray(data.detail)
          ? data.detail.map((d) => `${d.loc[d.loc.length - 1]}: ${d.msg}`).join("; ")
          : data.detail;
        showMessage(`The prediction failed: ${detail || res.statusText}`, "error");
      } else {
        showResult(data);
      }
    } catch (err) {
      showMessage("Couldn't reach the server. If it was idle, it may be waking up; try again in a minute.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Predict churn";
    }
  });
</script>
</body>
</html>
